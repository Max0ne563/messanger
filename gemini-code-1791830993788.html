<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>P2P Chat</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 0 16px; }
    #chat { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
    input, button { padding: 8px; font-size: 14px; }
  </style>
</head>
<body>
  <h3>Локальный P2P Чат</h3>
  <p>Твой ID: <strong id="my-id">генерация...</strong></p>
  
  <input id="peer-id-input" placeholder="ID друга">
  <button onclick="connectToPeer()">Подключиться</button>

  <div id="chat"></div>

  <input id="msg-input" placeholder="Сообщение..." style="width: 70%;">
  <button onclick="sendMessage()">Отправить</button>

  <script>
    const peer = new Peer();
    let conn = null;

    peer.on('open', id => {
      document.getElementById('my-id').innerText = id;
    });

    peer.on('connection', connection => {
      conn = connection;
      setupConnection();
    });

    function connectToPeer() {
      const friendId = document.getElementById('peer-id-input').value;
      conn = peer.connect(friendId);
      setupConnection();
    }

    function setupConnection() {
      conn.on('data', data => appendMessage('Друг: ' + data));
      conn.on('open', () => appendMessage('--- Соединение установлено ---'));
    }

    function sendMessage() {
      const input = document.getElementById('msg-input');
      if (conn && input.value) {
        conn.send(input.value);
        appendMessage('Я: ' + input.value);
        input.value = '';
      }
    }

    function appendMessage(text) {
      const chat = document.getElementById('chat');
      chat.innerHTML += `<div>${text}</div>`;
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
